<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食品加工换线 · 过敏原追踪与放行</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <h1>食品加工换线 · 过敏原追踪系统</h1>
  <div class="subtitle">Node.js + SQLite · 本地保存 · 产出过敏原 = 原料 ∪ 引用批次 ∪ 设备残留</div>
</header>

<nav class="tabs">
  <button class="tab active" data-tab="batches">批次与放行</button>
  <button class="tab" data-tab="events">事件时间线（加工 / 清洗）</button>
  <button class="tab" data-tab="base">原料与设备</button>
</nav>

<div id="notice" class="notice hidden"></div>

<main>
  <!-- ============ 批次视图 ============ -->
  <section id="tab-batches" class="tab-panel active">
    <div class="panel-head">
      <h2>设备当前残留</h2>
    </div>
    <div id="residueCards" class="residue-grid"></div>

    <div class="panel-head">
      <h2>批次推导结果与放行</h2>
      <button class="btn primary" id="btnNewEventTop">＋ 录入事件</button>
    </div>
    <div id="batchList" class="batch-list"></div>
  </section>

  <!-- ============ 事件视图 ============ -->
  <section id="tab-events" class="tab-panel">
    <div class="panel-head">
      <h2>按时间排序的加工与已核实清洗事件</h2>
      <button class="btn primary" id="btnNewEvent">＋ 录入事件</button>
    </div>
    <div id="eventList" class="event-list"></div>
  </section>

  <!-- ============ 基础数据 ============ -->
  <section id="tab-base" class="tab-panel">
    <div class="base-grid">
      <div>
        <div class="panel-head">
          <h2>原料及其过敏原</h2>
          <button class="btn primary" id="btnNewMaterial">＋ 新增原料</button>
        </div>
        <table class="grid">
          <thead><tr><th>编码</th><th>名称</th><th>过敏原</th><th></th></tr></thead>
          <tbody id="materialRows"></tbody>
        </table>
      </div>
      <div>
        <div class="panel-head">
          <h2>设备</h2>
          <button class="btn primary" id="btnNewEquipment">＋ 新增设备</button>
        </div>
        <table class="grid">
          <thead><tr><th>编码</th><th>名称</th><th></th></tr></thead>
          <tbody id="equipmentRows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<!-- ============ 事件弹窗 ============ -->
<div id="eventModal" class="modal hidden">
  <div class="modal-box wide">
    <h3 id="eventModalTitle">录入事件</h3>
    <form id="eventForm">
      <div class="form-row">
        <label>事件类型</label>
        <select name="type" id="evType">
          <option value="PROCESS">加工</option>
          <option value="CLEAN">已核实清洗</option>
        </select>
      </div>
      <div class="form-row">
        <label>时间 <span class="req">*</span></label>
        <input type="datetime-local" name="event_time" required>
      </div>
      <div class="form-row">
        <label>设备 <span class="req">*</span></label>
        <select name="equipment_id" id="evEquipment" required></select>
      </div>
      <div id="processFields">
        <div class="form-row">
          <label>产出批次编码 <span class="req">*</span></label>
          <input type="text" name="batch_code" placeholder="如 BATCH-006">
        </div>
        <div class="form-row align-top">
          <label>原料输入</label>
          <div id="evMaterials" class="check-grid"></div>
        </div>
        <div class="form-row align-top">
          <label>引用此前批次</label>
          <div id="evBatches" class="check-grid"></div>
          <small class="hint">只能引用产出时间早于本事件时间的批次；引用未来批次或形成循环会被拒绝。</small>
        </div>
      </div>
      <div class="form-row">
        <label>备注 / 核实说明</label>
        <input type="text" name="note" placeholder="如：CIP + 目视复核">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" id="eventCancel">取消</button>
        <button type="submit" class="btn primary">提交（整单校验）</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 原料弹窗 ============ -->
<div id="materialModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="materialModalTitle">新增原料</h3>
    <form id="materialForm">
      <input type="hidden" name="id">
      <div class="form-row"><label>编码 *</label><input type="text" name="code" required></div>
      <div class="form-row"><label>名称 *</label><input type="text" name="name" required></div>
      <div class="form-row align-top">
        <label>过敏原（逗号分隔）</label>
        <input type="text" name="allergens" placeholder="如：乳,蛋">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 设备弹窗 ============ -->
<div id="equipmentModal" class="modal hidden">
  <div class="modal-box">
    <h3 id="equipmentModalTitle">新增设备</h3>
    <form id="equipmentForm">
      <input type="hidden" name="id">
      <div class="form-row"><label>编码 *</label><input type="text" name="code" required></div>
      <div class="form-row"><label>名称 *</label><input type="text" name="name" required></div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>取消</button>
        <button type="submit" class="btn primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 放行弹窗 ============ -->
<div id="releaseModal" class="modal hidden">
  <div class="modal-box">
    <h3>登记批次放行</h3>
    <form id="releaseForm">
      <input type="hidden" name="batch_id">
      <div class="form-row"><label>批次</label><input type="text" name="batch_code" readonly></div>
      <div class="form-row align-top">
        <label>当时推导过敏原</label>
        <div id="releaseAllergens" class="tag-row"></div>
      </div>
      <div class="form-row"><label>放行时间 *</label><input type="datetime-local" name="released_at" required></div>
      <div class="form-row"><label>放行人</label><input type="text" name="released_by" placeholder="姓名/工号"></div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>取消</button>
        <button type="submit" class="btn primary">以当时结果登记放行</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
